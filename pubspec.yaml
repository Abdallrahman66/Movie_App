name: movie_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  loading_animation_widget: ^1.3.0
  toastification: ^3.2.0
  cached_network_image: ^3.4.1
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  injectable: ^3.0.0
  get_it: ^9.2.1
  flutter_floating_bottom_bar: ^3.0.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  injectable_generator: ^3.0.2
  build_runner: ^2.15.0
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#111318"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
